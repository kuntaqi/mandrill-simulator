name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the version (leave empty to bump the minor automatically)'
        required: false

permissions:
  contents: write

jobs:
  # Worked out once and handed to the others: three runners computing it
  # separately could disagree, and the tag has to match what was built.
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.pick.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.version }}" ]; then
            value="${{ github.event.inputs.version }}"
            echo "Using the version given by hand: $value"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            value="${GITHUB_REF_NAME#v}"
            echo "Using the pushed tag: $value"
          else
            major="$(tr -cd '0-9' < version.txt)"
            [ -n "$major" ] || { echo "version.txt holds no number"; exit 1; }

            # Highest minor already released for this major. A freshly bumped
            # major has no tags yet, so its minor starts at 0.
            latest="$(git tag -l "v${major}.*" \
              | sed -E "s/^v${major}\.([0-9]+).*/\1/" \
              | grep -E '^[0-9]+$' \
              | sort -n | tail -1 || true)"

            if [ -z "$latest" ]; then next=0; else next=$((latest + 1)); fi
            value="${major}.${next}.0"
            echo "Major $major from version.txt, previous minor '${latest:-none}' -> $value"
          fi

          echo "value=$value" >> "$GITHUB_OUTPUT"

  pack:
    needs: version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            rid: win-x64
            channel: win
            mainExe: MandrillSimulator.exe
          - os: macos-latest
            name: macos
            rid: osx-arm64
            channel: osx
            mainExe: MandrillSimulator
          - os: ubuntu-latest
            name: linux
            rid: linux-x64
            channel: linux
            mainExe: MandrillSimulator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      # Self-contained on purpose: the app must not ask a tester to install a
      # runtime first. Never add trimming here — the XAML uses reflection
      # bindings and the trimmer would strip them silently.
      - name: Publish
        run: >
          dotnet publish src/MandrillSimulator -c Release -r ${{ matrix.rid }} --self-contained -o publish
          -p:Version=${{ needs.version.outputs.value }}

      - name: Pack installer
        run: >
          vpk pack
          --packId MandrillSimulator
          --packVersion ${{ needs.version.outputs.value }}
          --packDir publish
          --mainExe ${{ matrix.mainExe }}
          --packTitle "Mandrill Simulator"
          --packAuthors "kuntaqi"
          --runtime ${{ matrix.rid }}
          --channel ${{ matrix.channel }}
          --outputDir releases

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: releases/*

  publish:
    needs: [version, pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail

          cat > notes.md <<'EOF'
          ## Install

          **Windows** — download `MandrillSimulator-win-Setup.exe` and run it. It installs per user,
          needs no administrator rights, and adds a Start Menu entry. Windows SmartScreen will warn
          the first time because the build is not code-signed; choose *More info* then *Run anyway*.

          **macOS and Linux — beta.** These builds compile and pack in CI but have not yet been
          installed or run on a real machine. Treat them as untested.

          - macOS: `MandrillSimulator-osx-Setup.pkg` (Gatekeeper will block an unsigned package;
            right-click ▸ Open, or clear the quarantine attribute)
          - Linux: the `.AppImage` — `chmod +x` it first. The HTML preview needs WebKitGTK
            (`sudo apt install libwebkit2gtk-4.1-0`); without it the app still runs and the preview
            tab says so.

          A portable zip is attached for anyone who would rather not install anything.
          EOF

          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mandrill Simulator $VERSION" \
            --notes-file notes.md \
            $(find artifacts -type f | tr '\n' ' ')
